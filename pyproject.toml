[project]
name = "trustai-reliability-lab"
version = "0.1.0"
description = "TrustAI — AI Reliability Lab"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.9.0",
  "sqlalchemy>=2.0.36",
  "pytest>=8.3.0",
  "httpx>=0.27.0",
  "numpy>=2.1.0",
  "pandas>=2.2.0",
]

[project.optional-dependencies]
lint = [
  "ruff>=0.6.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
